<main class="auth-page">

  <section class="auth-panel login-panel">

    <!-- HEADER -->
    <header class="auth-header">
      <img src="assets/images/tass.png" alt="TASS Logo" class="brand-logo" />
    </header>


    <!-- CONTENIDO -->
    <div class="auth-content">

      <form [formGroup]="loginForm" (ngSubmit)="submit()">

        <!-- CORREO -->
        <label>
          <p class="letter-size">Iniciar sesión</p>

          <input type="email" formControlName="correo" placeholder="Ingrese su correo electrónico"
            [class.input-error]="isInvalid('correo')" />
        </label>

        @if (isInvalid('correo')) {
        <small class="field-error">
          Ingresa un correo electrónico válido.
        </small>
        }


        <!-- CONTRASEÑA -->
        <label>

          <div class="password-field">

            <input [type]="passwordVisible ? 'text' : 'password'" formControlName="password"
              placeholder="Ingrese su contraseña" [class.input-error]="isInvalid('password')" />

            <button type="button" class="password-toggle" (click)="passwordVisible = !passwordVisible"
              [attr.aria-label]="
                passwordVisible
                  ? 'Ocultar contraseña'
                  : 'Mostrar contraseña'
              ">

              <mat-icon aria-hidden="true">{{ passwordVisible ? 'visibility_off' : 'visibility' }}</mat-icon>

            </button>

          </div>

        </label>

        @if (isInvalid('password')) {
        <small class="field-error">
          La contraseña es obligatoria.
        </small>
        }


        <!-- BOTÓN -->
        <button type="submit" [disabled]="loginForm.invalid">
          Ingresar
        </button>

      </form>


      <!-- REGISTRO -->
      <p class="auth-link">
        ¿Necesitas crear una cuenta?
        <a routerLink="/registro">Crear usuario</a>
      </p>

    </div>

  </section>

  <aside class="auth-brand-panel" aria-label="Identidad de TASS">
    <img src="assets/images/logo-tass.png" alt="TASS Technology" />
    <img class="brand-shield" src="assets/images/tass.png" alt="Escudo TASS" />
  </aside>

</main>
