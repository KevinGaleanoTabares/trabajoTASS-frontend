<main class="auth-page">
  <section class="auth-panel">
    <div class="brand">
      <img src="../../../../assets/images/tass.png" alt="TASS Logo" class="brand-logo" />
    </div>
    <h2>
    <p class="letter-size">Crear cuenta de usuario en TASS</p>
    <p style="color: red"> * = Campo requerido </p>
      </h2>
    <form [formGroup]="registerForm" (ngSubmit)="submit()">
      <div class="form-grid">
        <label>
          Nombres *
          <input type="text" formControlName="nombres" [class.input-error]="isInvalid('nombres')" placeholder="Ingrese sus nombres" />
          @if (isInvalid('nombres')) {
          <small class="field-error">Ingresa mínimo dos caracteres. *</small>
          }
        </label>

        <label>
          Apellidos *
          <input type="text" formControlName="apellidos" [class.input-error]="isInvalid('apellidos')" placeholder="Ingrese sus apellidos"/>
          @if (isInvalid('apellidos')) {
            <small class="field-error">Ingresa mínimo dos caracteres. *</small>
          }
        </label>

        <label>
          Tipo de documento *
           <select formControlName="tipoDocumento" [class.input-error]="isInvalid('tipoDocumento')">
            <option value="">Selecciona una opción</option>
            <option value="CC">CC</option>
            <option value="CE">CE</option>
            <option value="NIT">NIT</option>
            <option value="PASAPORTE">Pasaporte</option>
          </select>
          @if (isInvalid('tipoDocumento')) {
            <small class="field-error">{{  getErrorMessage('tipoDocumento')  }}</small>
          }
        </label>

        <label>
          Número de documento *
          <input type="text" formControlName="numeroDocumento" [class.input-error]="isInvalid('numeroDocumento')" placeholder="Ingrese el número de documento"/>
          @if (isInvalid('numeroDocumento')) {
            <small class="field-error">{{ getErrorMessage('numeroDocumento') }}</small>
          }
        </label>

        @if (authorizationError) {
          <small class="field-error authorization-error">{{ authorizationError }}</small>
        }

         <label>
          Correo electrónico *
          <input type="email" formControlName="correo" [class.input-error]="isInvalid('correo')" placeholder="Ingrese su correo electrónico"/>
          @if (isInvalid('correo')) {
            <small class="field-error">{{ getErrorMessage('correo') }}</small>
          }
        </label>

            <label>
          Teléfono *
          <input type="tel" formControlName="telefono" [class.input-error]="isInvalid('telefono')" placeholder="Ingrese su número de teléfono"/>
          @if (isInvalid('telefono')) {
            <small class="field-error">Ingresa un número de teléfono válido. *</small>
          }
        </label>

         <label>
          Vinculación con TASS *
          <select formControlName="tipoVinculacion" [class.input-error]="isInvalid('tipoVinculacion')">
            <option value="">Selecciona una opción</option>
            <option value="empleado">Empleado</option>
            <option value="administrativo">Administrativo</option>
            <option value="directivo">Directivo</option>
            <option value="proveedor">Proveedor</option>
          </select>
            @if (isInvalid('tipoVinculacion')) {
            <small class="field-error">Selecciona una opción. *</small>
          }
        </label>

        @if (registerForm.get('tipoVinculacion')?.value === 'proveedor') {
        <label class="empresa-nit">
          NIT de la empresa *

          <input type="text" formControlName="empresaProveedora" (blur)="buscarEmpresa()" [class.input-error]="isInvalid('empresaProveedora')"
            placeholder="Ingrese el NIT de la empresa" />

            @if (registerForm.get('empresaProveedora')?.errors?.['backend']) {
            <small class="field-error">
              {{ registerForm.get('empresaProveedora')?.errors?.['backend'] }}
            </small>
            }

            @if (empresaEncontrada) {
            <small class="field-success">
              Empresa encontrada: {{ empresaEncontrada }}
            </small>
            }

          @if (isInvalid('empresaProveedora')) {
          <small class="field-error">
            Ingresa un NIT válido. *
          </small>
          }
        </label>
        }

        <label>
          Cargos *
          <select formControlName="cargo">
            <option value="">Seleccione un cargo</option>

            @for (cargo of cargos; track cargo) {
            <option [value]="cargo">
              {{ cargo }}
            </option>
            }
          </select>
            @if (isInvalid('cargo')) {
            <small class="field-error">Selecciona una opción. *</small>
          }
        </label>

        <label [class.password-after-provider]="registerForm.get('tipoVinculacion')?.value === 'proveedor'">
          Contraseña *
          <div class="password-field">
            <input
              [type]="passwordVisible ? 'text' : 'password'"
              formControlName="password"
              [class.input-error]="isInvalid('password')"
              placeholder="Ingrese su contraseña"
            />
            <button type="button" class="password-toggle" (click)="passwordVisible = !passwordVisible"
              [attr.aria-label]="passwordVisible ? 'Ocultar contraseña' : 'Mostrar contraseña'">
              <mat-icon aria-hidden="true">{{ passwordVisible ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
          </div>
          @if (isInvalid('password')) {
            <small class="field-error">
              Mínimo 9 caracteres totales, entre ellos al menos: 1 mayúscula, 1 minúscula, 1 número y 1 carácter especial, entre ellos: [ _!@#$%^&*() ]. *
            </small>
          }
        </label>

        <label [class.password-after-provider]="registerForm.get('tipoVinculacion')?.value === 'proveedor'">
          Confirmar contraseña *
          <div class="password-field">
            <input
              [type]="confirmPasswordVisible ? 'text' : 'password'"
              formControlName="confirmPassword"
              [class.input-error]="isInvalid('confirmPassword') ||
              (registerForm.hasError('passwordMismatch')) &&
              registerForm.get('confirmPassword')?.touched"
              placeholder="Confirma tu contraseña"
            />
            <button type="button" class="password-toggle" (click)="confirmPasswordVisible = !confirmPasswordVisible"
              [attr.aria-label]="confirmPasswordVisible ? 'Ocultar contraseña' : 'Mostrar contraseña'">
              <mat-icon aria-hidden="true">{{ confirmPasswordVisible ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
          </div>

          @if (registerForm.hasError('passwordMismatch') &&
          registerForm.get('confirmPassword')?.touched) {
            <small class="field-error">
              Las contraseñas no coinciden *
            </small>
          }
          @if (isInvalid('confirmPassword')) {
            <small class="field-error">Confirma la contraseña. *</small>
          }
        </label>
      </div>

      <button type="submit" [disabled]="registerForm.invalid || isSubmitting">
        {{ isSubmitting ? 'Creando usuario...' : 'Crear usuario' }}
      </button>
    </form>
    <p class="auth-link">
      ¿Ya tienes una cuenta?
      <a routerLink="/login"> Iniciar sesión </a>
    </p>
  </section>

  <aside class="auth-brand-panel" aria-label="Identidad de TASS">
    <img src="assets/images/logo-tass.png" alt="TASS Technology" />
    <img class="brand-shield" src="assets/images/tass.png" alt="Escudo TASS" />
  </aside>
</main>
